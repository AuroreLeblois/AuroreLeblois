name: generate pacman contribution graph

on:
  schedule: # Tous les jours à minuit
    - cron: '0 0 * * *'
  workflow_dispatch: # Lancement manuel
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # Remplace la palette verte de GitHub par du violet
      - name: recolor SVGs in purple
        run: |
          sed -i \
            -e 's/#9be9a8/#d8b4fe/Ig' -e 's/#40c463/#a855f7/Ig' -e 's/#30a14e/#7e22ce/Ig' -e 's/#216e39/#581c87/Ig' \
            -e 's/#0e4429/#3b0764/Ig' -e 's/#006d32/#6b21a8/Ig' -e 's/#26a641/#9333ea/Ig' -e 's/#39d353/#c084fc/Ig' \
            dist/*.svg

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
